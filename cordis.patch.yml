# dsh-qt-skills 的 bundle patch：安装本包后由 DSH 自动应用。
#
# 两条踩过的坑（本机 profile 里已有先例记录）：
#   1) name 必须带 @deepseek-ai/ 前缀。宿主 host-module-fallback.mjs 的
#      HOST_PACKAGE_PREFIX = '@deepseek-ai/'，只有带前缀的包解析失败才会回退到
#      app.asar 内置包；写成短名 'dsh-mcp-client' 直接 ERR_MODULE_NOT_FOUND。
#   2) MCP 行必须放在 insert 列表里；stdio 服务器必须显式写 transport: stdio，
#      缺了会按 streamable-http 处理并抛 TypeError（reading 'sessionId'）。
- insert:
    # 1) 插件本体：注册 13 个 qt-* 技能（source = bundled）
    - id: qt-skills
      name: dsh-qt-skills

    # 2) Qt 官方文档 MCP：托管服务，Streamable HTTP，无本地进程
    - id: qt-docs-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: qt-docs
        url: https://qt-docs-mcp.qt.io/mcp

    # 3) QML 实时预览 MCP：本地 stdio，但它指向的 exe 路径因机器而异
    #    （Qt 6.12+ 安装目录的 bin/QmlPreviewMcpServer.exe），默认不启用。
    #    要用就取消下面五行的注释并改成你的真实路径，然后重启 DSH。
    #    - id: qt-qml-preview-mcp
    #      name: "@deepseek-ai/dsh-mcp-client"
    #      config:
    #        serverName: qml-preview
    #        transport: stdio
    #        command: C:\Qt\6.12.0\msvc2022_64\bin\QmlPreviewMcpServer.exe
